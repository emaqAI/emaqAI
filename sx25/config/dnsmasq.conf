# SX25 — dnsmasq w trybie proxyDHCP + serwer TFTP
# ---------------------------------------------------------------------------
# To jest SZABLON. Skrypt scripts/serve.sh podstawia w miejsce znaczników
# @SX25_*@ realne wartości i uruchamia dnsmasq z wygenerowanym plikiem.
# Możesz też skopiować ten plik, ręcznie podmienić znaczniki i uruchomić:
#   dnsmasq --conf-file=twoj.conf --no-daemon
# ---------------------------------------------------------------------------

# Nie pełnimy roli serwera DNS — tylko proxyDHCP + TFTP.
port=0

# Więcej logów rozruchu (przydatne przy diagnozie).
log-dhcp

# proxyDHCP: współpracujemy z istniejącym serwerem DHCP w tej podsieci.
# Nie przydzielamy adresów IP — tylko wskazujemy plik startowy (PXE).
dhcp-range=@SX25_SUBNET@,proxy

# Serwer TFTP (pierwszy etap: dostarczenie binariów iPXE do klienta BIOS/UEFI).
enable-tftp
tftp-root=@SX25_TFTP_ROOT@

# --- Wykrywanie klienta i architektury ---------------------------------------
# Klient, który JUŻ uruchomił iPXE, wysyła opcję 175.
dhcp-match=set:ipxe,175
# Architektura firmware klienta (opcja DHCP 93).
dhcp-match=set:bios,option:client-arch,0     # BIOS / legacy PC
dhcp-match=set:efi32,option:client-arch,6    # UEFI IA32
dhcp-match=set:efi64,option:client-arch,7    # UEFI x86_64
dhcp-match=set:efi64,option:client-arch,9    # UEFI x86_64 (EBC)

# --- Etap 1: dostarcz właściwe iPXE (o ile klient jeszcze nie jest w iPXE) ---
dhcp-boot=tag:bios,tag:!ipxe,undionly.kpxe
dhcp-boot=tag:efi64,tag:!ipxe,ipxe.efi
dhcp-boot=tag:efi32,tag:!ipxe,ipxe32.efi

# --- Etap 2: iPXE już działa -> przekaż mu nasze menu przez HTTP ------------
# HTTP jest szybsze i stabilniejsze niż TFTP dla dużych plików (kernel/initrd).
dhcp-boot=tag:ipxe,http://@SX25_SERVER_IP@:@SX25_HTTP_PORT@/boot/menu.ipxe

# Identyfikacja serwera w logach PXE.
dhcp-option=vendor:PXEClient,6,2b
pxe-prompt="SX25 Multi-Boot — rozruch sieciowy", 2
